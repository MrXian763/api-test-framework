[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -s -v --html=reports/pytest_report.html --self-contained-html
          --alluredir=reports/allure_results
env =
    PYTHONIOENCODING=utf-8
norecursedirs = .git .svn .hg *.egg-info venv .venv logs reports data
pythonpath = .
markers =
    smoke: 冒烟测试用例
    regression: 回归测试用例
    high: 高优先级用例
    medium: 中优先级用例
    low: 低优先级用例
